
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Details | Siswa-Gigs</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f3ff;
    color: #30234a;
    font-size: 14px;
}

/* HEADER */
header {
    background: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 12px rgba(57, 33, 109, 0.07);
}

.logo {
    color: #5936a8;
    font-size: 23px;
    font-weight: bold;
}

.logo span {
    color: #e3ae28;
}

nav {
    display: flex;
    align-items: center;
    gap: 22px;
}

nav a {
    color: #555;
    text-decoration: none;
    font-size: 14px;
}

nav a:hover,
nav a.active {
    color: #7147c7;
}

/* CONTAINER */
.container {
    max-width: 1050px;
    margin: 35px auto;
    padding: 0 25px;
}

.back-link {
    color: #7147c7;
    text-decoration: none;
    font-size: 14px;
    display: inline-block;
    margin-bottom: 22px;
}

.back-link:hover {
    color: #39216d;
}

/* JOB HEADER */
.job-header {
    background: linear-gradient(120deg, #39216d, #8058ce);
    color: white;
    padding: 35px;
    border-radius: 15px;
    margin-bottom: 25px;
    position: relative;
    overflow: hidden;
}

.job-header::after {
    content: "";
    position: absolute;
    width: 170px;
    height: 170px;
    border: 30px solid #ffffff12;
    border-radius: 50%;
    right: -40px;
    top: -80px;
}

.hero-content {
    position: relative;
    z-index: 1;
}

.category {
    display: inline-block;
    background: #eee7fa;
    color: #5936a8;
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 12px;
    margin-bottom: 15px;
}

.job-header h1 {
    font-size: 29px;
    margin-bottom: 12px;
    line-height: 1.4;
}

.job-header p {
    color: #eee7ff;
    font-size: 14px;
    line-height: 1.6;
}

/* JOB LAYOUT */
.job-layout {
    display: grid;
    grid-template-columns: 1.7fr 1fr;
    gap: 22px;
    align-items: start;
}

/* CONTENT CARDS */
.content-card,
.summary-card {
    background: white;
    padding: 27px;
    border-radius: 13px;
    border: 1px solid #eee7fa;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(57, 33, 109, 0.035);
}

.content-card h2,
.summary-card h2 {
    color: #39216d;
    font-size: 19px;
    margin-bottom: 15px;
}

.content-card p {
    color: #666;
    font-size: 14px;
    line-height: 1.8;
    white-space: pre-line;
    overflow-wrap: anywhere;
}

/* SUMMARY CARD */
.summary-card {
    position: sticky;
    top: 20px;
}

.summary-item {
    padding: 14px 0;
    border-bottom: 1px solid #eeeaf5;
}

.summary-item:last-of-type {
    border-bottom: none;
}

.summary-item span {
    display: block;
    color: #888;
    font-size: 12px;
    margin-bottom: 6px;
}

.summary-item strong {
    color: #39216d;
    font-size: 14px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.salary {
    color: #5936a8 !important;
    font-size: 21px !important;
    font-weight: bold;
}

/* APPLY BUTTON */
.apply-btn {
    display: block;
    width: 100%;
    text-align: center;
    background: #f5cd55;
    color: #39216d;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    text-decoration: none;
    margin-top: 20px;
    cursor: pointer;
    transition: 0.2s;
}

.apply-btn:hover {
    background: #edbd36;
    transform: translateY(-2px);
}

.apply-btn.disabled {
    background: #d5d0dd;
    color: #777;
    cursor: not-allowed;
    pointer-events: none;
    transform: none;
}

.note {
    color: #888;
    font-size: 11px;
    line-height: 1.6;
    text-align: center;
    margin-top: 12px;
}

/* NOT FOUND */
.not-found {
    background: white;
    padding: 55px 25px;
    text-align: center;
    border: 1px solid #eee7fa;
    border-radius: 15px;
}

.not-found-icon {
    font-size: 42px;
    margin-bottom: 15px;
}

.not-found h2 {
    color: #39216d;
    font-size: 20px;
    margin-bottom: 10px;
}

.not-found p {
    color: #888;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 20px;
}

.back-button {
    display: inline-block;
    background: #5936a8;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
}

.back-button:hover {
    background: #39216d;
}

/* FOOTER */
footer {
    background: #39216d;
    color: #eee7ff;
    text-align: center;
    padding: 25px;
    margin-top: 40px;
    font-size: 12px;
}

/* RESPONSIVE */
@media (max-width: 750px) {

    header {
        flex-direction: column;
        gap: 15px;
    }

    nav {
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
    }

    nav a {
        font-size: 12px;
    }

    .container {
        padding: 0 16px;
    }

    .job-layout {
        grid-template-columns: 1fr;
    }

    .job-header {
        padding: 25px;
    }

    .job-header h1 {
        font-size: 25px;
    }

    .summary-card {
        position: static;
    }

    .content-card,
    .summary-card {
        padding: 22px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">SISWA<span>-GIGS</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="student-dashboard.html">Dashboard</a>
        <a href="browse-jobs.html" class="active">Find Jobs</a>
        <a href="login.html">Logout</a>
    </nav>
</header>

<main class="container">

    <a href="browse-jobs.html" class="back-link">
        ← Back to Available Jobs
    </a>

    <div id="jobDetails">
        <!-- Dynamic job information will appear here -->
    </div>

</main>

<footer>
    © 2026 Siswa-Gigs | Your Campus. Your Opportunities. Your Future.
</footer>

<script>

const STORAGE_KEY = "siswaGigsJobs";

const jobDetails = document.getElementById("jobDetails");

// GET JOB ID FROM URL
const urlParams = new URLSearchParams(window.location.search);
const selectedJobId = urlParams.get("jobId");

// FORMAT DATE
function formatDate(dateValue) {

    if (!dateValue) {
        return "Not specified";
    }

    const date = new Date(dateValue + "T00:00:00");

    if (Number.isNaN(date.getTime())) {
        return dateValue;
    }

    return date.toLocaleDateString("en-MY", {
        day: "2-digit",
        month: "long",
        year: "numeric"
    });

}

// FORMAT TIME
function formatTime(timeValue) {

    if (!timeValue) {
        return "Not specified";
    }

    const parts = timeValue.split(":");

    if (parts.length < 2) {
        return timeValue;
    }

    let hour = Number(parts[0]);
    const minute = parts[1];

    const period = hour >= 12 ? "PM" : "AM";

    hour = hour % 12 || 12;

    return hour + ":" + minute + " " + period;

}

// GET JOB DURATION
function getDuration(job) {

    if (!job.startDate) {
        return job.jobType || "Flexible";
    }

    if (!job.endDate || job.startDate === job.endDate) {
        return "1 Day";
    }

    const start = new Date(job.startDate + "T00:00:00");
    const end = new Date(job.endDate + "T00:00:00");

    const difference = Math.round(
        (end - start) / (1000 * 60 * 60 * 24)
    ) + 1;

    return difference + (difference === 1 ? " Day" : " Days");

}

// SHOW NOT FOUND
function showNotFound(title, description) {

    jobDetails.innerHTML = "";

    const container = document.createElement("div");
    container.className = "not-found";

    const icon = document.createElement("div");
    icon.className = "not-found-icon";
    icon.textContent = "🔎";

    const heading = document.createElement("h2");
    heading.textContent = title;

    const paragraph = document.createElement("p");
    paragraph.textContent = description;

    const link = document.createElement("a");
    link.href = "browse-jobs.html";
    link.className = "back-button";
    link.textContent = "Browse Available Jobs";

    container.append(icon, heading, paragraph, link);

    jobDetails.appendChild(container);

}

// CREATE CONTENT CARD
function createContentCard(title, content) {

    const card = document.createElement("div");
    card.className = "content-card";

    const heading = document.createElement("h2");
    heading.textContent = title;

    const paragraph = document.createElement("p");

    paragraph.textContent =
        content || "No information provided.";

    card.append(heading, paragraph);

    return card;

}

// CREATE SUMMARY ITEM
function createSummaryItem(label, value) {

    const item = document.createElement("div");
    item.className = "summary-item";

    const span = document.createElement("span");
    span.textContent = label;

    const strong = document.createElement("strong");
    strong.textContent = value || "Not specified";

    item.append(span, strong);

    return item;

}

// DISPLAY JOB INFORMATION
function displayJob(job) {

    jobDetails.innerHTML = "";

    // =================================
    // JOB HEADER
    // =================================

    const hero = document.createElement("section");
    hero.className = "job-header";

    const heroContent = document.createElement("div");
    heroContent.className = "hero-content";

    const category = document.createElement("span");
    category.className = "category";
    category.textContent = job.category || "Other";

    const title = document.createElement("h1");
    title.textContent = job.title || "Untitled Job";

    const employer = document.createElement("p");
    employer.textContent =
        (job.employerName || "Campus Employer") +
        " · " +
        (job.location || "Location not specified");

    heroContent.append(category, title, employer);
    hero.appendChild(heroContent);

    // =================================
    // MAIN JOB LAYOUT
    // =================================

    const layout = document.createElement("section");
    layout.className = "job-layout";

    // LEFT COLUMN
    const left = document.createElement("div");
    left.className = "left-column";

    // 1. JOB DESCRIPTION
    left.appendChild(
        createContentCard(
            "Job Description",
            job.description
        )
    );

    // 2. JOB RESPONSIBILITIES
    left.appendChild(
        createContentCard(
            "Job Responsibilities",
            job.responsibilities
        )
    );

    // 3. JOB REQUIREMENTS
    left.appendChild(
        createContentCard(
            "Job Requirements",
            job.jobRequirements
        )
    );

    // 4. JOB SKILLS
    left.appendChild(
        createContentCard(
            "Job Skills",
            job.requiredSkills
        )
    );

    // =================================
    // RIGHT COLUMN - JOB OVERVIEW
    // =================================

    const right = document.createElement("aside");
    right.className = "right-column";

    const summary = document.createElement("div");
    summary.className = "summary-card";

    const summaryTitle = document.createElement("h2");
    summaryTitle.textContent = "Job Overview";

    // HOURLY RATE
    const salaryItem = document.createElement("div");
    salaryItem.className = "summary-item";

    const salaryLabel = document.createElement("span");
    salaryLabel.textContent = "Hourly Rate";

    const salary = document.createElement("strong");
    salary.className = "salary";

    salary.textContent =
        "RM " + (Number(job.hourlyRate) || 0).toFixed(2) + " / hour";

    salaryItem.append(salaryLabel, salary);

    // WORKING HOURS
    const workingHours =
        job.startTime && job.endTime
            ? formatTime(job.startTime) + " – " + formatTime(job.endTime)
            : "Not specified";

    // ONLY FOUR OVERVIEW DETAILS
    const summaryItems = [
        ["Job Duration", getDuration(job)],
        ["Working Hours", workingHours],
        ["Location", job.location],
        ["Vacancies", (Number(job.vacancies) || 0) + " Students"]
    ];

    summary.append(summaryTitle, salaryItem);

    summaryItems.forEach(item => {

        summary.appendChild(
            createSummaryItem(item[0], item[1])
        );

    });

    // =================================
    // APPLY BUTTON
    // =================================

    const applyButton = document.createElement("a");

    applyButton.className = "apply-btn";
    applyButton.textContent = "Apply Now";

    applyButton.href =
        "apply-job.html?jobId=" +
        encodeURIComponent(job.jobId);

    const note = document.createElement("p");
    note.className = "note";

    note.textContent =
        "Review the job information and your availability before submitting an application.";

    // CHECK JOB AVAILABILITY
    const today = new Date().toLocaleDateString("en-CA");

    const isExpired =
        job.closingDate && job.closingDate < today;

    const isUnavailable =
        job.status !== "Active" ||
        isExpired ||
        Number(job.vacancies) <= 0;

    if (isUnavailable) {

        applyButton.classList.add("disabled");
        applyButton.removeAttribute("href");
        applyButton.textContent = "Applications Closed";

        note.textContent =
            "This job is currently unavailable for new applications.";

    }

    summary.append(applyButton, note);

    right.appendChild(summary);

    layout.append(left, right);

    jobDetails.append(hero, layout);

}

// =================================
// LOAD SELECTED JOB
// =================================

function loadJobDetails() {

    if (!selectedJobId) {

        showNotFound(
            "No Job Selected",
            "Please return to the job listings and select a job to view its details."
        );

        return;

    }

    try {

        const savedData = localStorage.getItem(STORAGE_KEY);

        if (!savedData) {

            showNotFound(
                "Job Not Found",
                "No saved job records were found. Please browse the available jobs again."
            );

            return;

        }

        const parsedData = JSON.parse(savedData);

        const jobs = Array.isArray(parsedData)
            ? parsedData
            : Object.values(parsedData || {});

        const selectedJob = jobs.find(job =>
            job && String(job.jobId) === String(selectedJobId)
        );

        if (!selectedJob) {

            showNotFound(
                "Job Not Found",
                "This job listing may have been deleted or is no longer available."
            );

            return;

        }

        displayJob(selectedJob);

    } catch (error) {

        console.error("Error loading job details:", error);

        showNotFound(
            "Unable to Load Job",
            "There was a problem reading the job information. Please try again."
        );

    }

}

// INITIAL LOAD
loadJobDetails();

</script>

</body>
</html>
