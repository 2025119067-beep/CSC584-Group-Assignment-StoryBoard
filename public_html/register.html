
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Siswa-Gigs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f7f3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .container {
            display: flex;
            width: 900px;
            max-width: 100%;
            min-height: 620px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(57, 33, 109, 0.12);
        }

        .welcome-panel {
            width: 40%;
            background: linear-gradient(145deg, #39216d, #7147c7);
            color: white;
            padding: 55px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .welcome-panel h1 {
            font-size: 32px;
            margin-bottom: 18px;
            line-height: 1.3;
        }

        .welcome-panel p {
            color: #eee7ff;
            line-height: 1.7;
            font-size: 14px;
        }

        .form-panel {
            width: 60%;
            padding: 45px 50px;
        }

        .form-panel h2 {
            color: #39216d;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #39216d;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd5ee;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #7147c7;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: #f5cd55;
            color: #39216d;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #7147c7;
            font-weight: bold;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #7147c7;
            font-size: 13px;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            .welcome-panel,
            .form-panel {
                width: 100%;
            }

            .welcome-panel {
                padding: 30px;
            }

            .form-panel {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="welcome-panel">
            <div class="logo">SISWA-GIGS</div>

            <h1>Start Your Campus Journey!</h1>

            <p>
                Create your student account and discover flexible
                micro-job opportunities around your campus.
                Gain experience, develop skills and earn extra income.
            </p>
        </div>

        <div class="form-panel">

            <h2>Create Account</h2>
            <p class="subtitle">Register as a student to get started.</p>

            <form>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" placeholder="Enter your student ID">
                </div>

                <div class="form-group">
                    <label>University Email</label>
                    <input type="email" placeholder="Enter your university email">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password">
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm your password">
                </div>

                <button type="button" class="register-btn">
                    Create Account
                </button>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

            <a href="index.html" class="back-home">← Back to Homepage</a>

        </div>
    </div>

</body>
</html>
